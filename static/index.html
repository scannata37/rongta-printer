<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Printer</title>
<style>
  :root {
    --bg: #f4f1ea; --ink: #1d1c1a; --muted: #77736b; --line: #e2ddd2;
    --card: #fffdf8; --accent: #2f6f4f; --accent-ink: #fff; --danger: #b4432f;
    --paper: #fff; --radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 18px 28px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .pill { font-size: 13px; padding: 5px 11px; border-radius: 99px; background: #eee;
          color: var(--muted); display: inline-flex; gap: 7px; align-items: center; cursor: default; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
  .pill.ok i { background: #3aa66b; } .pill.bad i { background: var(--danger); }

  .modes { display: flex; gap: 10px; padding: 18px 28px 0; flex-wrap: wrap; }
  .mode { border: 1px solid var(--line); background: var(--card); border-radius: 10px;
          padding: 9px 14px; font-size: 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .mode.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .mode[disabled] { opacity: .45; cursor: not-allowed; }
  .mode small { font-size: 11px; color: var(--muted); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px;
         padding: 18px 28px 40px; max-width: 1180px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  label.h { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
            color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  textarea { width: 100%; min-height: 130px; resize: vertical; font: inherit; font-size: 16px;
             line-height: 1.45; padding: 14px; border: 1px solid var(--line); border-radius: 10px;
             background: #fff; color: var(--ink); }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 22px; }
  .row { display: flex; gap: 12px; align-items: center; }
  input[type=text] { font: inherit; font-size: 15px; padding: 9px 11px; border: 1px solid var(--line);
                     border-radius: 8px; background: #fff; width: 100%; color: var(--ink); }
  .items { list-style: none; margin: 0 0 10px; padding: 0; }
  .items li { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .items li input { padding: 7px 10px; }
  .x { border: none; background: none; color: var(--muted); font-size: 20px; cursor: pointer;
       width: 30px; height: 30px; border-radius: 6px; flex: none; }
  .x:hover { background: #f3e3df; color: var(--danger); }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 0 14px; }
  .toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; margin-top: 18px; cursor: pointer; }
  button.btn { font: inherit; font-size: 15px; font-weight: 600; border: none; border-radius: 10px;
               padding: 12px 18px; cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .ghost { background: transparent; border: 1px solid var(--line) !important; color: var(--ink); }

  .paper-wrap { background: #e9e4d8; border-radius: var(--radius); padding: 22px 0 0;
                display: flex; justify-content: center; overflow: hidden; }
  .paper { width: 360px; background: var(--paper); padding: 18px 12px 26px; min-height: 260px;
           font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.2px; line-height: 1.5;
           box-shadow: 0 2px 10px rgba(0,0,0,.08);
           -webkit-mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,
             conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 8px repeat-x;
                   mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,
             conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 8px repeat-x; }
  .paper div { white-space: pre; overflow: hidden; min-height: 1.5em; }
  .paper .b { font-weight: 700; }
  .paper .big { font-size: 22.4px; line-height: 1.25; }
  .paper .center { text-align: center; } .paper .right { text-align: right; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
           background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px;
           opacity: 0; transition: .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.err { background: var(--danger); }
  kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: #fff; }

  .items li.ex { flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: 8px 0; }
  .items li.ex > input.name { flex: 1; font-weight: 600; }
  .nums { display: flex; gap: 6px; align-items: center; width: 100%; padding-top: 6px; font-size: 13px; color: var(--muted); }
  .nums input { width: 58px !important; padding: 6px 7px !important; text-align: center; }
  .nums input.dur { width: 84px !important; }
  .nums select { font: inherit; font-size: 13px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .star { border: none; background: none; font-size: 19px; cursor: pointer; width: 30px; height: 30px;
          border-radius: 6px; color: #c9c3b6; flex: none; }
  .star.on { color: #d79b16; }
  .star:hover { background: #f6efdc; }
  .opt { display: none; } .opt.show { display: flex; }
  #presets { margin: 0 0 22px; }
  #presets:empty { display: none; }
  .routines { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .routine { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px;
             padding: 11px 13px; cursor: pointer; font: inherit; color: var(--ink); }
  .routine:hover { border-color: var(--accent); background: #f3f8f4; }
  .routine b { display: block; font-size: 15px; margin-bottom: 2px; }
  .routine span { font-size: 12px; color: var(--muted); }
  details.lib { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  details.lib summary { cursor: pointer; padding: 10px 13px; font-size: 14px; font-weight: 600; }
  .libgroups { padding: 2px 13px 12px; }
  .libgroup { margin-top: 8px; }
  .libgroup h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
          border-radius: 99px; padding: 5px 11px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip small { opacity: .7; margin-left: 4px; }
  .routine.open { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: #f3f8f4; }
  .picker { border: 1px solid var(--accent); border-radius: 12px; background: #fff; padding: 14px 16px; margin-top: 12px; }
  .picker-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .picker-head b { font-size: 16px; }
  .picker-head .links button { font: inherit; font-size: 13px; border: none; background: none; color: var(--accent);
                               cursor: pointer; padding: 2px 6px; }
  .pick { display: flex; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid #f0ece3;
          cursor: pointer; font-size: 15px; user-select: none; }
  .pick:last-child { border-bottom: none; }
  .pick input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .pick .nm { flex: 1; } .pick .nt { font-size: 13px; color: var(--muted); }
  .pick.off .nm { color: var(--muted); text-decoration: line-through; }
  .picker-actions { display: flex; gap: 10px; margin-top: 12px; }
  .picker-actions .btn { padding: 10px 16px; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Receipt Printer <span>· print anything</span></h1>
  <div id="status" class="pill"><i></i><span>Checking printer…</span></div>
</header>

<nav class="modes" id="modes">
  <button class="mode" data-mode="shopping">🛒 Shopping list</button>
  <button class="mode" data-mode="todo">✅ To-do</button>
  <button class="mode" data-mode="gym">🏋️ Gym</button>
</nav>

<main>
  <section class="card">
    <label class="h" for="dictation" id="dictLabel">Say your list</label>
    <textarea id="dictation" autofocus></textarea>
    <div class="hint" id="hint"></div>

    <div id="presets"></div>

    <label class="h" for="title" id="titleLabel">Title</label>
    <input id="title" type="text">

    <div style="height:22px"></div>
    <label class="h" id="itemsLabel">Items</label>
    <ul id="items" class="items"></ul>
    <div class="row"><input id="add" type="text"></div>

    <label class="toggle opt" data-for="shopping"><input id="aisle" type="checkbox" checked> Group by aisle</label>
  </section>

  <section>
    <div class="paper-wrap"><div id="paper" class="paper"></div></div>
    <div class="actions">
      <button id="print" class="btn primary">Print</button>
      <button id="clear" class="btn ghost">Clear</button>
    </div>
    <div class="hint" style="text-align:center"><kbd>⌘</kbd> + <kbd>Enter</kbd> prints</div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const norm = (s) => String(s || "").trim().toLowerCase();

// ---------------------------------------------------------------------------
// Mode definitions. Each mode says how to label the screen, how to identify
// an item (key), and how to draw one editable row.
// ---------------------------------------------------------------------------
const MODES = {
  shopping: {
    dictLabel: "Say your list", itemsLabel: "Items", titleLabel: "Store",
    titlePh: "Optional — e.g. Trader Joe's", addPh: "Add an item and press Enter",
    printLabel: "Print list",
    placeholder: "Click here, then dictate with Wispr Flow. e.g. “I’m going to Trader Joe’s. My list is bananas, apples, a gallon of milk, eggs and mac and cheese.”",
    hint: "Commas, “and”, or new lines split items. Filler words get dropped. Mention a store (“going to Market Basket”) to put it on the slip.",
    key: (i) => norm(i), label: (i) => i,
    fromText: (t) => t[0].toUpperCase() + t.slice(1),
    row: (item, set) => [textInput(item, (v) => set(v))],
  },
  todo: {
    dictLabel: "Say what you need to do", itemsLabel: "Tasks", titleLabel: "Title",
    titlePh: "Optional — defaults to TO-DO", addPh: "Add a task and press Enter",
    printLabel: "Print to-dos",
    placeholder: "e.g. “Today I need to call the bank, it’s urgent, finish my resume, go to the gym and call mom and dad.”",
    hint: "Say “urgent”, “important” or “top priority” and the task goes in the PRIORITY section. Tap ★ to change it. Say “my daily routine” to load the preset.",
    routinesLabel: "Start from a routine", libLabel: "Add common tasks",
    key: (i) => norm(i.text), label: (i) => i.text,
    fromText: (t) => ({ text: t[0].toUpperCase() + t.slice(1), priority: false }),
    row: (item, set) => {
      const star = document.createElement("button");
      star.className = "star" + (item.priority ? " on" : ""); star.textContent = "★";
      star.title = item.priority ? "Priority" : "Mark as priority";
      star.onclick = () => { set({ ...item, priority: !item.priority }); renderItems(); };
      return [star, textInput(item.text, (v) => set({ ...item, text: v }))];
    },
  },
  gym: {
    dictLabel: "Say your workout", itemsLabel: "Exercises", titleLabel: "Workout",
    titlePh: "Optional — e.g. Push day", addPh: "Add an exercise, e.g. “Squat 5x5 at 225”, and press Enter",
    printLabel: "Print workout",
    placeholder: "e.g. “Push day. Bench press 3 sets of 8 at 185, incline dumbbell press 3x10 with 60s, tricep pushdowns 3 by 12, and 20 minutes on the treadmill.”",
    hint: "Say “today’s push”, “today’s pull” or “today’s legs” to load a full workout, or your own: “3 sets of 8 at 185”, “3x8”, “20 minutes”. Each set prints a box with a blank to write what you actually did.",
    routinesLabel: "Today’s workout", libLabel: "Add exercises",
    chipNote: (i) => i.duration || (i.sets && i.reps ? `${i.sets}×${i.reps}` : ""),
    key: (i) => norm(i.name), label: (i) => i.name, rowClass: "ex",
    fromText: (t) => ({ name: t, sets: null, reps: null, weight: null, unit: "lb", duration: null }),
    row: (item, set) => {
      let latest = item;   // keep every field edit, not just the last one
      const upd = (patch) => { latest = { ...latest, ...patch }; set(latest); };
      const name = textInput(item.name, (v) => upd({ name: v }));
      name.classList.add("name");
      const num = (field, ph) => {
        const i = document.createElement("input"); i.type = "text"; i.inputMode = "decimal";
        i.placeholder = ph; i.value = item[field] ?? ""; i.title = ph;
        i.oninput = () => upd({ [field]: i.value === "" ? null : (isNaN(+i.value) ? i.value : +i.value) });
        return i;
      };
      const unit = document.createElement("select");
      ["lb", "kg"].forEach((u) => unit.add(new Option(u, u, false, (item.unit || "lb") === u)));
      unit.onchange = () => upd({ unit: unit.value });
      const dur = document.createElement("input"); dur.type = "text"; dur.className = "dur";
      dur.placeholder = "time"; dur.title = "e.g. 20 min"; dur.value = item.duration ?? "";
      dur.oninput = () => upd({ duration: dur.value || null });
      const nums = document.createElement("div"); nums.className = "nums";
      nums.append(num("sets", "sets"), "×", num("reps", "reps"), "@", num("weight", "wt"), unit, "or", dur);
      return [name, "X", nums];   // "X" = where the remove button goes
    },
  },
};

function textInput(value, onInput) {
  const i = document.createElement("input"); i.type = "text"; i.value = value ?? "";
  i.oninput = () => onInput(i.value); return i;
}

// ---------------------------------------------------------------------------
// State, one bucket per mode. The list = whatever the dictation box parses to,
// plus items added by hand. Edits and deletions are remembered by item key, so
// re-parsing the dictation never undoes them.
// ---------------------------------------------------------------------------
const fresh = () => ({ text: "", dictated: [], manual: [], removed: new Set(), edits: {},
                       title: "", parsedTitle: "", titleTouched: false, options: { by_aisle: true }, picker: null });
const S = { shopping: fresh(), todo: fresh(), gym: fresh() };
let mode = "shopping";
try { if (MODES[localStorage.rpMode]) mode = localStorage.rpMode; } catch {}
const st = () => S[mode], cfg = () => MODES[mode];

function currentItems() {
  const s = st(), c = cfg(), out = [], seen = new Set();
  const push = (orig) => {
    const k = c.key(orig);
    if (s.removed.has(k)) return;
    const item = k in s.edits ? s.edits[k] : orig;
    const shown = norm(c.label(item));
    if (!shown || seen.has(shown)) return;
    seen.add(shown); out.push({ k, item });
  };
  s.dictated.forEach(push); s.manual.forEach(push);
  return out;
}

// ---------------------------------------------------------------------------
// Presets: one tap loads a whole routine (replacing the list); chips in the
// library add or remove single items.
// ---------------------------------------------------------------------------
let PRESETS = {};

// Tapping a routine opens it as a checklist, every item ticked. Untick what
// you're skipping, then Print. The preview and Print button follow the ticks.
function openPicker(key, r) {
  const s = st();
  if (s.picker && s.picker.key === key) return closePicker();
  s.picker = { key, r, off: new Set() };
  $("title").value = r.title;
  renderItems(); refreshPreview();
}
function closePicker() {
  const s = st(); s.picker = null; $("title").value = s.title;
  renderItems(); refreshPreview();
}
function pickerItems() {
  const p = st().picker; if (!p) return [];
  return (p.r.exercises || p.r.items).filter((_, i) => !p.off.has(i));
}
function pickerToList() {   // "Edit as list": move the ticked items into the editor
  const p = st().picker, items = pickerItems().map((i) => ({ ...i }));
  S[mode] = { ...fresh(), manual: items, title: p.r.title };
  switchMode(mode);
}

function renderPicker() {
  const s = st(), p = s.picker, c = cfg(), all = p.r.exercises || p.r.items;
  const box = document.createElement("div"); box.className = "picker";
  const head = document.createElement("div"); head.className = "picker-head";
  head.innerHTML = '<b></b><span class="links"><button data-a="all">All</button><button data-a="none">None</button></span>';
  head.querySelector("b").textContent = `${p.r.emoji} ${p.r.title}`;
  head.querySelector("[data-a=all]").onclick = () => { p.off.clear(); renderItems(); refreshPreview(); };
  head.querySelector("[data-a=none]").onclick = () => { all.forEach((_, i) => p.off.add(i)); renderItems(); refreshPreview(); };
  box.append(head);
  all.forEach((it, i) => {
    const row = document.createElement("label"); row.className = "pick" + (p.off.has(i) ? " off" : "");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !p.off.has(i);
    cb.onchange = () => { cb.checked ? p.off.delete(i) : p.off.add(i);
                          row.classList.toggle("off", !cb.checked); refreshPreview(); };
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = c.label(it);
    const nt = document.createElement("span"); nt.className = "nt"; nt.textContent = (c.chipNote && c.chipNote(it)) || "";
    row.append(cb, nm, nt); box.append(row);
  });
  const act = document.createElement("div"); act.className = "picker-actions";
  const pr = document.createElement("button"); pr.className = "btn primary"; pr.textContent = "Print " + p.r.label;
  pr.onclick = doPrint;
  const ed = document.createElement("button"); ed.className = "btn ghost"; ed.textContent = "Edit as list";
  ed.onclick = pickerToList;
  const cl = document.createElement("button"); cl.className = "btn ghost"; cl.textContent = "Close";
  cl.onclick = closePicker;
  act.append(pr, ed, cl); box.append(act);
  return box;
}

function toggleChip(item) {
  const c = cfg(), s = st(), k = c.key(item);
  const inList = currentItems().some((i) => i.k === k || c.key(i.item) === k);
  if (inList) { s.removed.add(k); }
  else { s.manual.push({ ...item }); s.removed.delete(k); delete s.edits[k]; }
  renderItems(); refreshPreview();
}

function renderPresets() {
  const box = $("presets"), p = PRESETS[mode], c = cfg(); box.innerHTML = "";
  if (!p) return;
  const lab = document.createElement("label"); lab.className = "h"; lab.textContent = c.routinesLabel;
  const grid = document.createElement("div"); grid.className = "routines";
  for (const r of Object.values(p.routines)) {
    const b = document.createElement("button"); b.className = "routine";
    b.innerHTML = `<b></b><span></span>`;
    b.querySelector("b").textContent = `${r.emoji} ${r.label}`;
    b.querySelector("span").textContent = r.blurb;
    const key = Object.keys(p.routines).find((k) => p.routines[k] === r);
    if (st().picker && st().picker.key === key) b.classList.add("open");
    b.onclick = () => openPicker(key, r); grid.append(b);
  }
  const det = document.createElement("details"); det.className = "lib";
  if (sessionStorage.getItem("lib-" + mode) === "1") det.open = true;
  det.ontoggle = () => sessionStorage.setItem("lib-" + mode, det.open ? "1" : "0");
  det.innerHTML = `<summary></summary><div class="libgroups"></div>`;
  det.querySelector("summary").textContent = c.libLabel;
  const groups = det.querySelector(".libgroups");
  const inList = new Set(currentItems().map((i) => c.key(i.item)));
  for (const [g, items] of Object.entries(p.library)) {
    const wrap = document.createElement("div"); wrap.className = "libgroup";
    wrap.innerHTML = `<h4></h4><div class="chips"></div>`; wrap.querySelector("h4").textContent = g;
    for (const it of items) {
      const chip = document.createElement("button");
      chip.className = "chip" + (inList.has(c.key(it)) ? " on" : "");
      chip.textContent = c.label(it);
      const note = c.chipNote && c.chipNote(it);
      if (note) { const sm = document.createElement("small"); sm.textContent = note; chip.append(sm); }
      chip.onclick = () => toggleChip(it);
      wrap.querySelector(".chips").append(chip);
    }
    groups.append(wrap);
  }
  box.append(lab, grid);
  if (st().picker) box.append(renderPicker());
  box.append(det);
}

// ---------------------------------------------------------------------------
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast", 3200);
}

async function checkStatus() {
  const pill = $("status");
  try {
    const s = await api("/api/status");
    pill.className = "pill " + (s.ok ? "ok" : "bad");
    pill.querySelector("span").textContent = s.ok ? `${s.printer} ready` : `${s.printer} not found`;
    pill.title = s.detail || "";
  } catch { pill.className = "pill bad"; pill.querySelector("span").textContent = "App not running"; }
}

// ---------------------------------------------------------------------------
function switchMode(m) {
  st().text = $("dictation").value;
  mode = m; try { localStorage.rpMode = m; } catch {}
  const c = cfg(), s = st();
  document.querySelectorAll(".mode").forEach((b) => b.classList.toggle("active", b.dataset.mode === m));
  document.querySelectorAll(".opt").forEach((o) => o.classList.toggle("show", o.dataset.for === m));
  $("dictLabel").textContent = c.dictLabel; $("itemsLabel").textContent = c.itemsLabel;
  $("titleLabel").textContent = c.titleLabel; $("title").placeholder = c.titlePh;
  $("add").placeholder = c.addPh; $("dictation").placeholder = c.placeholder; $("hint").textContent = c.hint;
  $("dictation").value = s.text; $("title").value = s.picker ? s.picker.r.title : s.title; $("aisle").checked = s.options.by_aisle;
  $("print").textContent = c.printLabel;
  renderItems(); refreshPreview(); $("dictation").focus();
}

const parseDictation = debounce(async () => {
  const m = mode, s = S[m];
  s.text = $("dictation").value;
  if (s.picker && s.text.trim()) { s.picker = null; $("title").value = s.title; }
  const res = await api("/api/parse", { mode: m, text: s.text });
  if (m !== mode) return;  // switched tabs while waiting
  if (!s.titleTouched) { s.title = res.title || ""; $("title").value = s.title; }
  s.dictated = res.items || [];
  renderItems(); refreshPreview();
}, 350);

function renderItems() {
  const ul = $("items"), c = cfg(), s = st(); ul.innerHTML = "";
  renderPresets();
  const picking = !!s.picker;
  ["itemsLabel", "items", "add"].forEach((id) => $(id).classList.toggle("hidden", picking));
  document.querySelectorAll("details.lib").forEach((d) => d.classList.toggle("hidden", picking));
  if (picking) return;
  const items = currentItems();
  if (!items.length) {
    ul.innerHTML = '<li class="empty">Nothing yet — dictate above or add below.</li>'; return;
  }
  for (const { k, item } of items) {
    const li = document.createElement("li"); if (c.rowClass) li.className = c.rowClass;
    const set = (v) => { s.edits[k] = v; refreshPreview(); };
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Remove";
    x.onclick = () => { s.removed.add(k); renderItems(); refreshPreview(); };
    const parts = c.row(item, set);
    if (!parts.includes("X")) parts.push("X");
    li.append(...parts.map((p) => (p === "X" ? x : p)));
    ul.append(li);
  }
}

function payload() {
  const s = st();
  const items = s.picker ? pickerItems() : currentItems().map((i) => i.item);
  return { mode, title: $("title").value, items, options: s.options };
}

const refreshPreview = debounce(async () => {
  const m = mode;
  const res = await api("/api/preview", payload());
  if (m !== mode) return;
  const paper = $("paper"); paper.innerHTML = "";
  for (const r of res.rows) {
    const d = document.createElement("div");
    d.textContent = r.text || " ";
    d.className = [r.bold && "b", r.big && "big", r.align].filter(Boolean).join(" ");
    paper.append(d);
  }
  $("print").disabled = !(st().picker ? pickerItems().length : currentItems().length);
}, 150);

async function doPrint() {
  if (!payload().items.length) return toast("Nothing ticked to print.", true);
  const label = cfg().printLabel;
  $("print").disabled = true; $("print").textContent = "Printing…";
  try {
    const r = await api("/api/print", payload());
    r.ok ? toast("🧾 Sent to printer") : toast("Print failed: " + r.detail, true);
  } catch (e) { toast("Couldn't reach the app — is it still running?", true); }
  $("print").textContent = label; refreshPreview();
}

async function addFromBox(e) {
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  const text = e.target.value.trim(), m = mode, s = st(), c = cfg();
  e.target.value = "";
  const res = await api("/api/parse", { mode: m, text });
  const items = res.items && res.items.length ? res.items : [c.fromText(text)];
  for (const it of items) { const k = c.key(it); s.manual.push(it); s.removed.delete(k); delete s.edits[k]; }
  if (m === mode) { renderItems(); refreshPreview(); }
}

$("dictation").addEventListener("input", parseDictation);
$("title").addEventListener("input", () => { st().title = $("title").value; st().titleTouched = true; refreshPreview(); });
$("aisle").addEventListener("change", () => { st().options.by_aisle = $("aisle").checked; refreshPreview(); });
$("add").addEventListener("keydown", addFromBox);
$("print").onclick = doPrint;
$("clear").onclick = () => { S[mode] = fresh(); switchMode(mode); };
document.querySelectorAll(".mode").forEach((b) => b.onclick = () => switchMode(b.dataset.mode));
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) doPrint(); });

api("/api/presets").then((p) => { PRESETS = p; renderPresets(); }).catch(() => {});
switchMode(mode); checkStatus(); setInterval(checkStatus, 15000);
</script>
</body>
</html>
